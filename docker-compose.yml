services:

  # ── Infraestructura base ────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentica
      POSTGRES_USER: agentica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentica_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentica"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  # ── Backend API ─────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://agentica:${POSTGRES_PASSWORD:-agentica_dev}@postgres:5432/agentica
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BUILDER_MODEL: ${BUILDER_MODEL:-openai/gpt-4o-mini}
      BUILDER_PROVIDER: ${BUILDER_PROVIDER:-openrouter}
      JWT_SECRET: ${JWT_SECRET:-super_secret_dev_key_change_in_prod}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@agentica.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '${CORS_ORIGINS:-["https://vleeng.com","https://www.vleeng.com","https://app.vleeng.com","http://localhost:5173"]}'
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - agent_builds:/app/builds
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.agentica-api.rule=Host(`vleeng.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.agentica-api.entrypoints=websecure"
      - "traefik.http.routers.agentica-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.agentica-api.loadbalancer.server.port=8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery worker ───────────────────────────────────────────────────────────

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://agentica:${POSTGRES_PASSWORD:-agentica_dev}@postgres:5432/agentica
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BUILDER_MODEL: ${BUILDER_MODEL:-openai/gpt-4o-mini}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - agent_builds:/app/builds
      - /var/run/docker.sock:/var/run/docker.sock
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q builds,evals,deploys

  # ── Frontend ────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      # Vacío = el browser usará URLs relativas → Traefik enruta /api → backend
      VITE_API_URL: ""
      VITE_WS_URL: ""
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.agentica-frontend.rule=Host(`vleeng.com`) && PathPrefix(`/agentica`)"
      - "traefik.http.routers.agentica-frontend.entrypoints=websecure"
      - "traefik.http.routers.agentica-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.agentica-frontend.middlewares=agentica-slash"
      - "traefik.http.middlewares.agentica-slash.redirectregex.regex=^https://vleeng\\.com/agentica$$"
      - "traefik.http.middlewares.agentica-slash.redirectregex.replacement=https://vleeng.com/agentica/"
      - "traefik.http.middlewares.agentica-slash.redirectregex.permanent=true"
      - "traefik.http.services.agentica-frontend.loadbalancer.server.port=5173"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  agent_builds:

networks:
  traefik_public:
    external: true
